[package]
name = "fr"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Igor Sidorov"]
repository = "https://github.com/binarycode/fr"
description = "Hebrew reading with Ilya Frank method"
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
gemini-rust = "1.7"
htmd = "0.5"
indoc = "2.0"
readabilityrs = "0.1"
reqwest = { version = "0.13" }
shaku = "0.6"
termimad = "0.34"
tokio = { version = "1.50", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing = { version = "0.1", features = ["attributes"] }
unicode-bidi = "0.3"
url = "2.5"
indicatif = "0.18.4"

[dev-dependencies]
mockall = "0.14"
