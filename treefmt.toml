on-unmatched = "fatal"

excludes = [".gitignore", "devbox.lock", "Cargo.lock", "LICENSE"]

[formatter.just]
command = "justfmt"
includes = ["justfile"]

[formatter.prettier]
command = "prettier"
options = ["--write", "--no-bracket-spacing"]
includes = ["*.json", "*.md", "*.yaml"]

[formatter.rustfmt]
command = "rustfmt"
includes = ["*.rs"]

[formatter.shfmt]
command = "shfmt"
options = ["--write", "--indent", "2"]
includes = [".envrc", "bin/justfmt"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
